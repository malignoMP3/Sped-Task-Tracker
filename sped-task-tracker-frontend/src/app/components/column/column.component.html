<div
  class="w-72 rounded-lg p-4 border-t-4"
  [ngClass]="{
    'bg-red-300 border-red-500': status === 'pending',
    'bg-yellow-300 border-yellow-500': status === 'progress',
    'bg-green-300 border-green-500': status === 'done'
  }"
>
  <h3 class="font-semibold mb-3 text-zinc-800 text-center">
    {{ title }}
  </h3>

  <app-card
    *ngFor="let task of tasks"
    [title]="task.title"
    [description]="task.description"
  ></app-card>
</div>
