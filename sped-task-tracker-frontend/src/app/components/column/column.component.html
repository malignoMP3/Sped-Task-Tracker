<div class="w-72 rounded-lg p-4 border-t-4" cdkDropList [id]="dropListId" [cdkDropListData]="tasks"
  [cdkDropListConnectedTo]="connectedTo" (cdkDropListDropped)="onDrop($event)" [ngClass]="{
    'bg-red-100 border-red-500': title === 'Pendente',
    'bg-yellow-100 border-yellow-500': title === 'Em andamento',
    'bg-green-100 border-green-500': title === 'Concluído'
  }">

  <h3 class="font-semibold mb-3 text-zinc-800 text-center">
    {{ title }}
  </h3>

  <div *ngFor="let task of tasks" cdkDrag>
    <app-card [title]="task.titulo" [description]="task.descricao" [dataCriacao]="task.dataCriacao"
      (select)="onSelect(task)" (delete)="onDelete(task)">
    </app-card>
  </div>

</div>
