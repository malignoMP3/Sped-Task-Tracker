<div class="min-h-screen bg-zinc-100">
  <div class="flex justify-evenly p-6">

    <app-column
      title="Pendente"
      [tasks]="pendingTasks"
      (selectTask)="onEditTask($event)"
    ></app-column>

    <app-column
      title="Em andamento"
      [tasks]="progressTasks"
      (selectTask)="onEditTask($event)"
    ></app-column>

    <app-column
      title="Concluído"
      [tasks]="doneTasks"
      (selectTask)="onEditTask($event)"
    ></app-column>

  </div>
</div>
